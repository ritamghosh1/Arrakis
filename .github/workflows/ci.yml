name: Arrakis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-contracts:
    name: TypeScript & Contracts Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Verify deterministic seed generator
        run: npm run seed

  recommender-check:
    name: Recommender (FastAPI) Syntax & Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python syntax
        run: python3 -m py_compile services/recommender/app/contracts.py services/recommender/app/main.py
